<script>
        // Nối front_end với backend qua POST /api/query (xem src/server.py).
        // KHÔNG chứa logic nghiệp vụ ở đây — chỉ gọi API và render kết quả.
        (function () {
            let currentLevel = 1;
            const levelButtons = document.querySelectorAll(".level-btn");
            const chatLog = document.getElementById("chat-log");
            const input = document.getElementById("question-input");
            const sendBtn = document.getElementById("send-btn");

            function setActiveLevel(level) {
                currentLevel = level;
                levelButtons.forEach((btn) => {
                    const isActive = parseInt(btn.dataset.level, 10) === level;
                    btn.classList.toggle("bg-primary", isActive);
                    btn.classList.toggle("text-on-primary", isActive);
                    btn.classList.toggle("bg-surface-container-high", !isActive);
                    btn.classList.toggle("text-on-surface-variant", !isActive);
                });
            }

            levelButtons.forEach((btn) => {
                btn.addEventListener("click", () => setActiveLevel(parseInt(btn.dataset.level, 10)));
            });

            function escapeHtml(str) {
                const div = document.createElement("div");
                div.textContent = str == null ? "" : String(str);
                return div.innerHTML;
            }

            function appendUserMessage(text) {
                const row = document.createElement("div");
                row.className = "flex justify-end w-full message-enter";
                const bubble = document.createElement("div");
                bubble.className =
                    "bg-tertiary-fixed text-on-tertiary-fixed-variant px-6 py-4 rounded-t-xl rounded-bl-xl rounded-br-sm max-w-[85%] font-body-md text-body-md soft-shadow";
                bubble.textContent = text;
                row.appendChild(bubble);
                chatLog.appendChild(row);
            }

            function appendAssistantMessage(innerHtml, isPlaceholder) {
                const row = document.createElement("div");
                row.className = "flex justify-start w-full gap-4 items-end message-enter";
                row.innerHTML =
                    '<div class="w-8 h-8 rounded-full bg-primary-container flex items-center justify-center shrink-0 mb-2">' +
                    '<span class="material-symbols-outlined text-on-primary-container text-sm">spa</span></div>' +
                    '<div class="bg-surface-container-lowest text-on-surface px-6 py-4 rounded-t-xl rounded-br-xl rounded-bl-sm max-w-[85%] font-body-md text-body-md soft-shadow border border-surface-variant/50"></div>';
                const bubble = row.querySelector("div.bg-surface-container-lowest");
                bubble.innerHTML = innerHtml;
                if (isPlaceholder) bubble.classList.add("italic", "text-on-surface-variant");
                chatLog.appendChild(row);
                row.scrollIntoView({ behavior: "smooth", block: "end" });
                return row;
            }

            function buildResultHtml(data) {
                let html = "<div>" + escapeHtml(data.answer).replace(/\n/g, "<br/>") + "</div>";

                html +=
                    '<div class="mt-3 pt-3 border-t border-surface-variant/50 flex gap-4 flex-wrap font-caption text-caption text-outline">' +
                    "<span>tool_calls: <b class=\"text-on-surface-variant\">" + escapeHtml(data.tool_calls) + "</b></span>" +
                    "<span>grounded: <b class=\"text-on-surface-variant\">" + escapeHtml(data.grounded) + "</b></span>";
                if (data.steps_used !== undefined && data.steps_used !== null) {
                    html += "<span>steps_used: <b class=\"text-on-surface-variant\">" + escapeHtml(data.steps_used) + "</b></span>";
                }
                html += "</div>";

                if (Array.isArray(data.trace) && data.trace.length > 0) {
                    html +=
                        '<details class="mt-3 pt-3 border-t border-surface-variant/50">' +
                        '<summary class="cursor-pointer font-label-md text-label-md text-primary">Xem trace (Thought → Action → Observation)</summary>' +
                        '<div class="mt-2 flex flex-col gap-2 font-caption text-caption text-on-surface-variant">';
                    data.trace.forEach((t) => {
                        html += "<div><b>Step " + escapeHtml(t.step) + "</b> — Thought: " + escapeHtml(t.thought || "");
                        if (t.action) html += "<br/>Action: " + escapeHtml(t.action);
                        if (t.observation) html += "<br/>Observation: " + escapeHtml(t.observation);
                        html += "</div>";
                    });
                    html += "</div></details>";
                }
                return html;
            }

            async function sendQuestion() {
                const question = input.value.trim();
                if (!question) return;

                input.value = "";
                sendBtn.disabled = true;
                appendUserMessage(question);
                const loadingRow = appendAssistantMessage(
                    "Đang xử lý (Level " + currentLevel + ")...",
                    true
                );

                try {
                    const res = await fetch("/api/query", {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({ level: currentLevel, question: question }),
                    });
                    const data = await res.json();
                    loadingRow.remove();

                    if (!res.ok || data.error) {
                        appendAssistantMessage(
                            '<span class="text-error">' + escapeHtml(data.error || "Lỗi không xác định từ server.") + "</span>"
                        );
                    } else {
                        appendAssistantMessage(buildResultHtml(data));
                    }
                } catch (err) {
                    loadingRow.remove();
                    appendAssistantMessage(
                        '<span class="text-error">Không kết nối được tới server: ' + escapeHtml(err.message) + "</span>"
                    );
                } finally {
                    sendBtn.disabled = false;
                    input.focus();
                }
            }

            sendBtn.addEventListener("click", sendQuestion);
            input.addEventListener("keydown", (e) => {
                if (e.key === "Enter") sendQuestion();
            });
        })();
    </script>
